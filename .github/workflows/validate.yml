name: Validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Validate plugin index
        run: npx --yes @kamaras/venpm validate plugins.json

      - name: Validate (strict)
        run: npx --yes @kamaras/venpm validate plugins.json --strict
